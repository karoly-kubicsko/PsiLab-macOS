# XcodeGen spec for the PsiLab app (https://github.com/yonaskolb/XcodeGen).
#
# It encodes the settings from app/SETUP.md so that the Xcode project can be generated
# instead of created by hand:
#
#     brew install xcodegen
#     cd xcode && xcodegen generate     # creates xcode/PsiLab.xcodeproj
#
# GitHub Actions (.github/workflows/app.yml) uses it to compile-check the app and to build a
# universal (arm64 + x86_64) ΨLab.app artifact. The generated project is not committed.
name: PsiLab

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  PsiLab:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: ../app/MacQC
        name: App
      - path: ../backend/src
        name: Backend
      - path: ../backend/include
        name: BackendHeaders
        buildPhase: none
      - path: ../third_party/nlohmann
        name: ThirdParty
        buildPhase: none
      # Gaussian94 basis-set files, copied as the folder Contents/Resources/basis.
      - path: ../basis
        type: folder
        buildPhase: resources

    dependencies:
      - sdk: Accelerate.framework

    # The app icon with every size up to 1024 x 1024 px. Xcode 26's asset-catalog compiler
    # (actool) writes Contents/Resources/AppIcon.icns with the 16, 32, 128 and 256 px images only
    # (the ΨLab 6.0 release had nothing larger than 256 x 256), so this phase rebuilds it with
    # iconutil from the ten PNG files of the asset catalog (16 ... 512 px at 1x and 2x, the
    # largest 1024 x 1024). It runs after the resources and before code signing.
    postBuildScripts:
      - name: "App icon: AppIcon.icns with every size up to 1024 px"
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          SRC="$SRCROOT/../app/MacQC/Assets.xcassets/AppIcon.appiconset"
          SET="$DERIVED_FILE_DIR/AppIcon.iconset"
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
          rm -rf "$SET"
          mkdir -p "$SET"
          for s in 16 32 128 256 512; do
            cp "$SRC/icon_${s}x${s}.png" "$SRC/icon_${s}x${s}@2x.png" "$SET/"
          done
          iconutil --convert icns "$SET" --output "$OUT"
          echo "AppIcon.icns: $(stat -f %z "$OUT") bytes, from $(ls "$SET" | wc -l | tr -d ' ') images (16 to 1024 px)"

    entitlements:
      path: PsiLab.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

    settings:
      base:
        # Visible name is ΨLab (app file, menu bar, Dock); identifiers stay ASCII.
        PRODUCT_NAME: "ΨLab"
        PRODUCT_MODULE_NAME: PsiLab
        PRODUCT_BUNDLE_IDENTIFIER: org.psilab.PsiLab
        MARKETING_VERSION: "15.0"
        CURRENT_PROJECT_VERSION: "15"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icon phase below reads the asset catalog and writes into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: "ΨLab"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Swift: language mode 6, with the Xcode 26 template's concurrency defaults.
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../app/MacQC/MacQC-Bridging-Header.h"
        # C++ backend.
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../backend/include $(SRCROOT)/../third_party"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -ffp-contract=off"
        # Matrix products (coupled cluster, Full CI, integral transformation) with Apple's BLAS.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) MACQC_USE_ACCELERATE=1"
        # Ad-hoc signing: runs locally (Apple Silicon requires some signature).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          # The integral and Full CI kernels profit from -O3 (vectorisation); the results of
          # HeH+ stay identical because -ffp-contract=off keeps IEEE arithmetic.
          GCC_OPTIMIZATION_LEVEL: "3"
