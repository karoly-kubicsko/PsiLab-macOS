name: backend

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the large RHF, Full CI and gradient cases (up to 341 basis functions / 11 million determinants, about 1.5 h)"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install NumPy (needed by the reference script)
        run: python3 -m pip install numpy

      - name: Expected reports match the reference script
        run: |
          python3 backend/tests/gen_expected.py
          git diff --exit-code -- backend/tests/data

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Terminal version, general molecule
        run: |
          printf 'molecule = H2O\nbasis = aug-cc-pVDZ\nR = 0.9572 angstrom\nangle = 104.52\n' > h2o.inp
          ./build/psilab h2o.inp h2o.out
          head -n 20 h2o.out
          ./build/psilab --estimate h2o.inp
          printf 'molecule = LiH\nbasis = aug-cc-pVDZ\nmethod = FCI\n' > lih.inp
          ./build/psilab lih.inp lih.out
          head -n 25 lih.out
          printf 'molecule = H2O\nmethod = FCI\n' > h2o-fci.inp
          if ./build/psilab h2o-fci.inp; then echo "Full CI for H2O must be refused"; exit 1; fi

      - name: Terminal version, job types (5.0)
        run: |
          printf 'molecule = H2O\nmethod = HF\njob = opt+freq+sp\nsp_method = CCSD(T)\nR = 1.0 angstrom\nangle = 110\n' > job5.inp
          ./build/psilab --estimate job5.inp
          ./build/psilab job5.inp job5.out
          grep -q "Stationary point found" job5.out
          grep -q "Normal termination" job5.out
          sed -n '/---- Summary/,$p' job5.out
          printf 'molecule = H2O\nmethod = CCSDTQ\njob = freq\nfci_memory = 8 GB\n' > h2o-ccsdtq.inp
          if ./build/psilab h2o-ccsdtq.inp > h2o-ccsdtq.out; then echo "CCSDTQ frequencies of H2O must be refused"; exit 1; fi
          grep -q "CCSDTQ frequencies for H2O is not possible" h2o-ccsdtq.out

      - name: Terminal version, relaxed scan (7.0)
        run: |
          printf 'molecule = H2O\nmethod = HF\njob = scan\nscan = 2 1 3 S 8 10.0\nscan_start = 100\n' > scan.inp
          ./build/psilab --estimate scan.inp
          ./build/psilab scan.inp scan.out
          grep -q "Scan point 9 of 9: A(H2–O1–H3) = 180.000000 deg" scan.out
          grep -q "Normal termination" scan.out
          sed -n '/---- Summary of the relaxed scan/,/All 9 points/p' scan.out

      - name: Terminal version, H2O2 and NH3 (7.0)
        run: |
          printf 'molecule = NH3\nmethod = HF\njob = scan\nscan = 2 1 3 4 S 7 -10.0   # umbrella\nscan_start = -110\n' > nh3.inp
          ./build/psilab nh3.inp nh3.out
          grep -q "Scan point 8 of 8: D(H2–N1–H3–H4) = -180.000000 deg" nh3.out
          sed -n '/---- Summary of the relaxed scan/,/All 8 points/p' nh3.out
          printf 'molecule = H2O2\nmethod = HF\njob = opt+freq\n' > h2o2.inp
          ./build/psilab h2o2.inp h2o2.out
          grep -q "Point group C2" h2o2.out
          grep -q "Normal termination" h2o2.out

      - name: Terminal version, custom molecules (9.0)
        run: |
          ./build/psilab --estimate examples/co2.inp
          ./build/psilab examples/co2.inp co2.out
          grep -q "CO2, 22 electrons, charge 0, closed-shell singlet" co2.out
          grep -q "Point group D∞h" co2.out
          grep -q "symmetry number 2; linear rigid rotor" co2.out
          grep -q "Normal termination" co2.out
          printf '%%chk=nh4.chk\n#p HF/aug-cc-pVDZ\n\nammonium\n\n1 1\nN 0 0 0\nH 0.59 0.59 0.59\nH -0.59 -0.59 0.59\nH -0.59 0.59 -0.59\nH 0.59 -0.59 -0.59\n\n' > nh4.gjf
          printf 'molecule = custom\ngeometry = nh4.gjf\nmethod = HF\njob = freq\n' > nh4.inp
          ./build/psilab nh4.inp nh4.out
          grep -q "Point group Td" nh4.out
          grep -q "symmetry number 12" nh4.out
          printf 'molecule = custom\ngeometry = nh4.gjf\ncharge = 0\n' > nh4-odd.inp
          if ./build/psilab nh4-odd.inp; then echo "an odd number of electrons must be refused"; exit 1; fi

      - name: Terminal version, transition states (7.0)
        run: |
          printf 'molecule = NH3\nmethod = HF\njob = ts+freq+sp\nangle = 116\nsp_method = CCSD(T)\n' > nh3ts.inp
          ./build/psilab nh3ts.inp nh3ts.out
          grep -q "Transition state found" nh3ts.out
          grep -q "Point group D3h" nh3ts.out
          grep -q "One imaginary frequency" nh3ts.out
          grep -q "Single-point energy at the transition state: CCSD(T)/aug-cc-pVDZ" nh3ts.out
          sed -n '/---- Transition-state check/,/^$/p' nh3ts.out
          sed -n '/Final energies:/,/G = E/p' nh3ts.out
          printf 'molecule = H2O2\nmethod = HF\njob = ts+freq\ndihedral = 160\nts_hessian = calcall\n' > h2o2ts.inp
          ./build/psilab h2o2ts.inp h2o2ts.out
          grep -q "Point group C2h" h2o2ts.out
          grep -q "Normal termination" h2o2ts.out

      - name: Terminal version, 15.0 (open shells, new methods, psilab INPUT > OUTPUT)
        run: |
          printf 'molecule = O2\nbasis = 6-31G\nmethod = UMP2\njob = opt+freq\nopt_hessian = recalcfc=2\nopt_algorithm = gediis\n' > o2.inp
          ./build/psilab --estimate o2.inp
          ./build/psilab o2.inp > o2.out
          grep -q "O2, 16 electrons" o2.out
          grep -q "RecalcFC=2" o2.out
          grep -q "Stationary point found" o2.out
          grep -q "Normal termination" o2.out
          grep -q "Hessian: analytic (UMP2" o2.out
          # analytic ROHF-based correlated Hessian; analytic open-shell Full CI Hessian (UHF orbitals)
          printf 'molecule = NO2\nbasis = STO-3G\nmethod = MP2\nreference = ROHF\njob = opt+freq\n' > no2.inp
          ./build/psilab no2.inp > no2.out
          grep -q "Hessian: analytic (ROMP2" no2.out
          grep -q "Normal termination" no2.out
          printf 'molecule = H2O\ncharge = 1\nmultiplicity = 2\nbasis = STO-3G\nmethod = FCI\nreference = UHF\njob = opt+freq\n' > h2op.inp
          ./build/psilab h2op.inp > h2op.out
          grep -q "Hessian: analytic (Full CI on UHF orbitals" h2op.out
          grep -q "Normal termination" h2op.out
          printf 'molecule = N\nbasis = 6-31G*\nmethod = ROHF\n' > n.inp
          ./build/psilab n.inp > n.out
          grep -q "quartet, reference ROHF" n.out
          printf 'molecule = H2O\nbasis = 6-31G\nmethod = QCISD(T)\njob = opt+freq\n' > qci.inp
          ./build/psilab qci.inp > qci.out
          grep -q "analytic" qci.out
          grep -q "Normal termination" qci.out
          printf 'molecule = C\nbasis = STO-3G\nmethod = FCI\n' > c.inp
          ./build/psilab c.inp > c.out
          grep -q "spin-adapted" c.out
          printf 'molecule = H2O\nmultiplicity = 2\n' > bad.inp
          if ./build/psilab bad.inp > bad.out; then echo "10 electrons with multiplicity 2 must be refused"; exit 1; fi

  # The same build and tests on macOS (Apple clang, libc++, matrix products through Apple's
  # Accelerate), and the installed terminal version: psilab must find its basis-set files in
  # <prefix>/share/psilab/basis through the executable's path, without the source tree.
  build-and-test-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Apple clang, Accelerate)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Installed terminal version (job types, basis files from the installed copy)
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/psilab"
          mv basis basis.hidden          # the compiled-in source-tree location must not be used
          cd "$RUNNER_TEMP"
          ./psilab/bin/psilab --version
          printf 'molecule = H2O\nmethod = HF\njob = opt+freq+sp\nsp_method = CCSD(T)\nR = 1.0 angstrom\nangle = 110\n' > job5.inp
          ./psilab/bin/psilab --estimate job5.inp
          ./psilab/bin/psilab job5.inp job5.out
          grep -q "Matrices     Apple Accelerate" job5.out
          grep -q "Stationary point found" job5.out
          grep -q "Normal termination" job5.out
          sed -n '/---- Summary/,$p' job5.out
          cd "$GITHUB_WORKSPACE" && mv basis.hidden basis

  # Recomputes the stored reference values with PySCF (an independent program), so the
  # numbers the C++ tests compare with are reproducible.
  pyscf-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySCF and geomeTRIC
        run: python3 -m pip install pyscf geometric

      - name: Integral invariants (S, T, V, ERI; l up to 5)
        run: python3 reference/pyscf_integral_reference.py --check

      - name: RHF energies (cases with up to 110 basis functions)
        run: python3 reference/pyscf_rhf_reference.py --check --max-nbf 110

      - name: Full CI energies (H2 up to aug-cc-pVQZ, LiH aug-cc-pVDZ)
        run: python3 reference/pyscf_fci_reference.py --check --max-det 300000 --max-orbitals 100

      - name: Coupled-cluster diagrams (signs against brute-force coupled cluster)
        run: python3 backend/tools/cc_diagrams.py --check

      - name: CCSD and CCSD(T) energies (H2, LiH, H2O)
        run: python3 reference/pyscf_cc_reference.py --check

      - name: RHF gradients, Hessians and dipole moments (cases up to 110 basis functions)
        run: python3 reference/pyscf_gradient_reference.py --check --max-nbf 110

      - name: CCSD, CCSD(T) and Full CI gradients (H2, LiH, H2O)
        run: python3 reference/pyscf_correlated_gradient_reference.py --check

      - name: RHF frequencies and thermochemistry (PySCF analytic Hessians)
        run: python3 reference/pyscf_frequency_reference.py --check

      - name: Optimised geometries (PySCF gradients + geomeTRIC)
        run: >
          python3 reference/pyscf_optimization_reference.py --check --only
          H2O/aug-cc-pVDZ/RHF H2O/aug-cc-pVDZ/CCSD "H2O/aug-cc-pVDZ/CCSD(T)" LiH/aug-cc-pVDZ/RHF
          "LiH/aug-cc-pVDZ/CCSD(T)" H2/aug-cc-pVTZ/FCI

      - name: Relaxed-scan points (PySCF gradients + geomeTRIC with a frozen coordinate)
        run: python3 reference/pyscf_scan_reference.py --check

      - name: H2O2 and NH3 (energies, gradients, optimised geometries, frequencies)
        run: python3 reference/pyscf_molecules_reference.py --check

      - name: Transition states (geomeTRIC, transition=True)
        run: python3 reference/pyscf_ts_reference.py --check

      - name: Molecular orbitals (basis functions up to h, RHF orbitals, Full CI natural orbitals)
        run: python3 reference/pyscf_orbitals_reference.py --check

      - name: Custom molecules (9.0; elements H-Kr, ions, a single atom, CCSD(T), a gradient)
        run: python3 reference/pyscf_custom_reference.py --check

      - name: Basis sets of 14.0 (6-31G family 6D, 6-311G, def2; energies, gradients, Hessian, orbitals)
        run: python3 reference/pyscf_basis_sets_reference.py --check

      - name: Elements beyond Kr (def2 sets with ECPs, I in 6-311G*; energies, gradients, Hessians)
        run: python3 reference/pyscf_ecp_reference.py --check

  # On request only: every RHF reference case, including H2O/aug-cc-pCV5Z (341 functions), and
  # every Full CI case, including LiH/aug-cc-pCVTZ (11 million determinants).
  rhf-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target macqc_rhf_tests macqc_fci_tests macqc_gradient_tests macqc_correlated_gradient_tests

      - name: All RHF cases against PySCF
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_rhf_tests

      - name: All Full CI cases against PySCF
        env:
          PSILAB_TEST_MAX_DET: "2e7"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_fci_tests

      - name: All gradient and Hessian cases (finite differences, PySCF up to aug-cc-pV5Z)
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_gradient_tests

      - name: Correlated gradients, triple-zeta cases
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_correlated_gradient_tests

      - name: Job types, including H2O CCSDT frequencies (19 CCSDT energies)
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_job_tests
