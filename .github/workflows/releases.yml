name: releases

# ONE-OFF version on the branch claude/psilab-5-0-dev-ypee0y, run by hand (workflow_dispatch on
# this branch); main keeps the regular releases.yml. It only sets the tags:
#   v6.0 -> 9904c29 (the tag is missing)
#   v7.0 -> c11b1d7 (the tag is at d0b5770)
# The workflow token was refused (HTTP 403) every time it tried to set a tag at a commit whose
# workflow files matched no branch tip, and it succeeded every time a branch tip had the same
# workflow files (v1.0, v2.0: claude/dazzling-hypatia-wngrbm; v4.0:
# claude/psilab-3-molecules-bases-61tfh7). The branch claude/release-6.0 is at 9904c29 and
# claude/fervent-thompson-voh6gk at c11b1d7. Each creation is tried up to 8 times, 30 s apart.
# v7.0 is moved if GitHub allows it; otherwise a probe tag at c11b1d7 is created and deleted
# first, and only then is the release v7.0 deleted with its tag and the tag created at c11b1d7.
# The releases are then completed (builds, notes) by the regular releases.yml on main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - name: Set the tags v6.0 and v7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          tag_commit() {  # the commit of a tag; empty if the tag does not exist
            local o
            o=$(gh api "repos/$GH_REPO/git/ref/tags/$1" --jq '.object.type + " " + .object.sha' 2> /dev/null) || return 0
            if [ "${o%% *}" = tag ]; then
              gh api "repos/$GH_REPO/git/tags/${o#* }" --jq .object.sha
            else
              echo "${o#* }"
            fi
          }
          create_tag() {  # create_tag NAME COMMIT
            local i
            for i in 1 2 3 4 5 6 7 8; do
              if gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$1" -f sha="$2" > /dev/null; then
                echo "created $1 at $2 (try $i)"
                return 0
              fi
              if [ "$(tag_commit "$1")" = "$2" ]; then
                echo "$1 is at $2"
                return 0
              fi
              echo "try $i: creating $1 at $2 was refused"
              [ "$i" = 8 ] || sleep 30
            done
            return 1
          }
          FAIL=0

          V6=9904c29c1c1f32c5d6db52008401eb5525b2b438
          AT=$(tag_commit v6.0)
          if [ "$AT" = "$V6" ]; then
            echo "v6.0 is at $V6 already"
          elif [ -z "$AT" ]; then
            create_tag v6.0 "$V6" || { echo "::error::v6.0 could not be created at $V6"; FAIL=1; }
          else
            echo "::error::v6.0 is at $AT; not changed"
            FAIL=1
          fi

          V7=c11b1d70689308d51448d420e3517be18a4c3790
          AT=$(tag_commit v7.0)
          if [ "$AT" = "$V7" ]; then
            echo "v7.0 is at $V7 already"
          elif [ -z "$AT" ]; then
            create_tag v7.0 "$V7" || { echo "::error::v7.0 could not be created at $V7"; FAIL=1; }
          elif gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v7.0" -f sha="$V7" -F force=true > /dev/null; then
            echo "moved v7.0 from $AT to $V7 (the release v7.0 stays)"
          else
            echo "moving v7.0 was refused; probing a new tag at $V7"
            PROBE="probe-v7.0-$GITHUB_RUN_ID"
            if create_tag "$PROBE" "$V7"; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$PROBE" && echo "deleted $PROBE"
              gh release delete v7.0 --cleanup-tag --yes && echo "deleted the release v7.0 and its tag (was at $AT)"
              create_tag v7.0 "$V7" || { echo "::error::v7.0 was deleted and could not be created at $V7"; FAIL=1; }
            else
              echo "::error::a tag at $V7 is refused; v7.0 left at $AT"
              FAIL=1
            fi
          fi

          echo "tags now:"
          gh api "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[] | .ref + " " + .object.sha'
          exit $FAIL
